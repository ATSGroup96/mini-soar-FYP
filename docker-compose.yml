# =============================================================================
# Mini-SOAR — service orchestration (Linux host, e.g. Kali VM)
#
#   scanner    : one-shot scan + CVE match + ML score + uplink (run on demand)
#   soar       : remediation worker (executes approved + 2FA-verified fixes)
#   api        : FastAPI gateway used by the dashboard (port 8000)
#   dashboard  : Next.js web UI (port 3000)
#
# scanner / soar / api share ONE engine image and use the host's network so
# they can see the VirtualBox Host-only lab directly (ARP discovery, OS
# detection and SSH need raw access). Every target is still filtered by
# ALLOWED_RANGES / DENY_HOSTS in code before a single packet is sent.
# =============================================================================
x-engine: &engine
  image: mini-soar-engine:latest
  build:
    context: .
    dockerfile: scanner/Dockerfile
  env_file: .env
  network_mode: host
  volumes:
    - ./data:/app/data
    - ./audit:/app/audit
    - ./reports/out:/app/reports/out
    - ./secrets:/app/secrets:ro

services:

  scanner:
    <<: *engine
    command: ["scan", "--scope", "env"]
    restart: "no"
    profiles: ["tools"]          # run on demand: docker compose run --rm scanner ...

  soar:
    <<: *engine
    entrypoint: ["python", "-m", "soar.worker"]
    restart: unless-stopped

  api:
    <<: *engine
    entrypoint: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are baked into the browser bundle at BUILD time,
      # so they are passed as build args (read from .env by compose).
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped
